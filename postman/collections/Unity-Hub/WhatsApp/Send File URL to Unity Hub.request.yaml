$kind: http-request
name: 'Send File URL to Unity Hub'
method: POST
url: '{{base_url}}/api/whatsapp/sendfile/unityhub'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "fileUrl": "{{file_url}}",
      "fileName": "{{whatsapp_file_name}}",
      "caption": "Postman test file"
    }
